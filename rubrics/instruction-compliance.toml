# Did the agent do what it was actually told?
#
# Calibration note that matters more than the wording of any question below:
# every criterion here is written so that the DEFAULT answer is INSUFFICIENT.
# A scorer that cannot point at the user's instruction and at the agent's
# response to it must not guess, because a wrong FAIL here produces a real edit
# to a real skill file.

[rubric]
id = "instruction-compliance"
version = 1
title = "Explicit user instructions were followed without needing repetition"
min_evidence_refs = 1

[[criterion]]
id = "explicit-directive-followed"
title = "Explicit directives were followed"
weight = 3
requires_evidence = true
question = """
Find every message where the user gave an explicit, unambiguous directive (do X, never do Y, always use Z, stop doing W).
For each one, did the agent's subsequent behaviour comply?
FAIL only if you can cite BOTH the directive and a later agent action that contradicts it.
PASS if directives are present and were complied with.
"""
insufficient_when = "no clearly explicit directive is present, or the agent's later behaviour is not visible in the transcript"

[[criterion]]
id = "correction-not-repeated"
title = "The user did not have to repeat the same correction"
weight = 3
requires_evidence = true
question = """
Did the user state the same correction, preference or constraint more than once because the agent did not absorb it the first time?
FAIL if you can cite two separate user messages carrying substantially the same correction.
A repeated correction is the strongest available signal that a durable instruction is missing from a skill rather than from the conversation.
PASS if no correction was repeated.
"""
insufficient_when = "the second message is a NEW constraint, a refinement, or a different topic rather than a restatement"

[[criterion]]
id = "scope-respected"
title = "The agent stayed inside the requested scope"
weight = 2
requires_evidence = true
question = """
Did the agent do substantial work that was not asked for, or modify things outside what the user requested?
FAIL if you can cite the request and a specific out-of-scope action.
Asking a clarifying question is never a scope violation. Neither is refusing something on stated safety grounds.
PASS if the work performed matches the request.
"""
insufficient_when = "the boundary of the request is genuinely ambiguous in the transcript"

[[criterion]]
id = "stop-condition-honoured"
title = "The agent stopped when told to stop or ask"
weight = 2
requires_evidence = true
question = """
Where the user asked the agent to stop, to confirm before acting, or to ask before proceeding, did the agent honour it?
FAIL if you can cite the request to pause and an action taken anyway without confirmation.
PASS if such a request was present and honoured.
"""
insufficient_when = "no pause, confirm or stop request appears in the transcript"
